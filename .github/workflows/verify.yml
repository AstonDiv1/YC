name: Verify Numéryl
on:
  pull_request:
  push:
    branches: [main]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r GITH/requirements.txt
      - run: python -m unittest discover -s GITH -p 'test*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test GITH/test_dossier_model.mjs GITH/test_portfolio.mjs
