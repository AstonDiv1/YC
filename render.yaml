# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free launch: complete requests are transmitted to the owner's mailbox.
# SQLite admin history requires a persistent disk to survive redeployments.
services:
  - type: web
    name: yc-digital
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/AstonDiv1/YC
    branch: main
    rootDir: GITH
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 60
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: CONTACT_EMAIL_ONLY
        value: "0"
      - key: REQUIRE_EMAIL_DELIVERY
        value: "1"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "YC Digital <onboarding@resend.dev>"
      - key: ADMIN_EMAIL
        value: yc.digital33@gmail.com
      - key: LOG_LEVEL
        value: INFO
